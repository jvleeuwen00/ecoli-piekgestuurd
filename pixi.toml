[workspace]
name = "ecoli-piekgestuurd"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = ">=3.13"
pip = ">=25.3"

[pypi-dependencies]
ipykernel = ">=7.1.0"
pydantic-settings = ">=2.14.1"
requests = ">=2.32.5"
ribasim = { version = "*", extras = ["delwaq"] }
ribasim-tools = { git = "https://github.com/d2hydro/ribasim_delwaq_aam.git", subdirectory = "src/ribasim_tools" }
contextily = ">=1.7.1"